name: Build VFX MUSIC VAULT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "config.js"
      - "icon.svg"
      - "manifest.json"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app tooling
        run: npm install
      - name: Prepare website assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFX-MUSIC-VAULT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release for in-app update notifications
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.2.0-${{ github.run_number }}
          name: VFX MUSIC VAULT APK build ${{ github.run_number }}
          body: "Android APK generated automatically by GitHub Actions. Download the APK asset below and install it on your Android device."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
